<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Finger Fridays</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1d22; font-family: 'Space Grotesk', system-ui, sans-serif; }
    canvas { display: block; }
    #scene-container { position: fixed; inset: 0; }
    #landing {
      position: fixed; inset: 0; z-index: 1; display: grid; place-items: end center; padding: 16px 16px 28px;
      background: linear-gradient(to top, rgba(18, 20, 26, 0.92), rgba(18, 20, 26, 0.6) 30%, rgba(18, 20, 26, 0) 60%);
    }
    #landing .card { max-width: 520px; text-align: center; color: #f4efe6; }
    #landing h1 { margin: 0; font-size: clamp(34px, 7vw, 56px); letter-spacing: -0.01em; }
    #landing p { margin: 6px 0 18px; font-size: 16px; line-height: 1.45; color: #e2dbcf; }
    #landing .buttons { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    #landing button {
      font: 700 15px 'Space Grotesk', system-ui, sans-serif; letter-spacing: 0.04em; cursor: pointer;
      color: #fff; background: #dc2626; border: 0; border-radius: 999px; padding: 14px 24px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.35);
    }
    #landing button.alt { background: #2b2e36; border: 1px solid #ffb36b; color: #ffb36b; }
    #landing [hidden] { display: none; }
    #landing #noXR { margin: 0; font-size: 14px; color: #ffb36b; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; color: #f4efe6; font-size: 18px; }
  </style>
</head>
<body>
  <div id="scene-container"></div>
  <div id="loading">Clocking in…</div>
  <div id="landing">
    <div class="card">
      <h1>Finger Fridays</h1>
      <p>It's 4:57 PM on a Friday. Poke out the email with your fingertips and slam the laptop shut when Gary walks past.</p>
      <div class="buttons">
        <button id="enterVR" hidden>ENTER VR OFFICE</button>
        <button id="enterMR" class="alt" hidden>MR: YOUR REAL DESK</button>
      </div>
      <p id="noXR" hidden>This game needs a VR headset. Open this page in the Meta Quest browser.</p>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
